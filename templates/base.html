<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FactoryIQ — AI Manufacturing Quality Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="/" class="sidebar-brand">
      <div class="brand-icon"><i class="fas fa-industry"></i></div>
      <div>
        <div class="brand-text">FactoryIQ</div>
        <div class="brand-sub">AI Quality Intelligence</div>
      </div>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a href="/dashboard" class="nav-link" data-page="dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="/machines"  class="nav-link" data-page="machines"><i class="fas fa-cogs"></i><span>Machines</span></a>
      <div class="nav-section-label">Quality</div>
      <a href="/predictions" class="nav-link" data-page="predictions"><i class="fas fa-chart-line"></i><span>Defect Prediction</span></a>
      <a href="/root-cause"  class="nav-link" data-page="root-cause"><i class="fas fa-search"></i><span>Root Cause</span></a>
      <a href="/analytics"   class="nav-link" data-page="analytics"><i class="fas fa-chart-bar"></i><span>Analytics</span></a>
      <div class="nav-section-label">Operations</div>
      <a href="/alerts"        class="nav-link" data-page="alerts"><i class="fas fa-bell"></i><span>Alerts <span id="nav-alert-count" class="badge badge-warning" style="display:none">0</span></span></a>
      <a href="/data"          class="nav-link" data-page="data"><i class="fas fa-upload"></i><span>Production Data</span></a>
      <a href="/reports"       class="nav-link" data-page="reports"><i class="fas fa-file-alt"></i><span>Reports</span></a>
      <div class="nav-section-label">AI</div>
      <a href="/knowledge" class="nav-link" data-page="knowledge"><i class="fas fa-database"></i><span>Knowledge Base</span></a>
      <a href="/copilot"   class="nav-link" data-page="copilot"><i class="fas fa-robot"></i><span>AI Copilot</span></a>
      <a href="/agents"    class="nav-link" data-page="agents"><i class="fas fa-project-diagram"></i><span>AI Agents</span></a>
    </nav>
    <div class="sidebar-status">
      <div><span class="status-dot online"></span><strong style="color:var(--text-secondary)">AI System Online</strong></div>
      <div id="sim-badge-sidebar" style="display:none" class="sim-badge"><i class="fas fa-play-circle"></i>Simulation Active</div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <div class="top-bar">
      <div>
        <div class="top-bar-title" id="page-title">Dashboard</div>
        <div class="top-bar-subtitle" id="page-subtitle">Manufacturing Process Quality Control</div>
      </div>
      <div class="top-bar-actions">
        <span id="groq-badge" class="badge badge-info" style="display:none"><i class="fas fa-brain"></i> Groq AI Active</span>
        <button class="btn btn-ghost btn-sm" id="refresh-btn" onclick="refreshPage()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
        <button class="btn btn-warning btn-sm" id="sim-toggle-btn" onclick="toggleSimulation()">
          <i class="fas fa-play-circle"></i> <span id="sim-btn-text">Start Simulation</span>
        </button>
      </div>
    </div>
    <div class="page-body" id="page-body">
      <!-- Page content injected here -->
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ── Global utilities ──────────────────────────────────────────────────────────
const API = (path, opts) => fetch(path, opts).then(r => r.json());

function toast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const icons = {success:'check-circle', error:'times-circle', warning:'exclamation-triangle', info:'info-circle'};
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas fa-${icons[type]||'info-circle'}" style="color:var(--accent-${type==='info'?'cyan':type==='success'?'green':type==='warning'?'amber':'red'})"></i>${msg}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function fmtVal(v, dec=1) { return v != null ? Number(v).toFixed(dec) : '—'; }
function fmtPct(v, dec=1) { return v != null ? Number(v*100).toFixed(dec)+'%' : '—'; }
function timeSince(ts) {
  if (!ts) return '—';
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 60) return `${Math.round(diff)}s ago`;
  if (diff < 3600) return `${Math.round(diff/60)}m ago`;
  return `${Math.round(diff/3600)}h ago`;
}
function riskColor(r) {
  return {CRITICAL:'red', HIGH:'red', MEDIUM:'amber', LOW:'green'}[r] || 'blue';
}
function statusColor(s) {
  return {critical:'red', warning:'amber', healthy:'green', offline:'muted'}[s] || 'muted';
}

// ── Active nav link ────────────────────────────────────────────────────────────
(function() {
  const path = window.location.pathname.replace(/^\//, '').split('/')[0] || 'dashboard';
  document.querySelectorAll('.nav-link').forEach(l => {
    const pg = l.dataset.page;
    if (pg === path || (path === '' && pg === 'dashboard')) l.classList.add('active');
  });
})();

// ── Simulation toggle ─────────────────────────────────────────────────────────
let simActive = false;
async function toggleSimulation() {
  const btn = document.getElementById('sim-btn-text');
  if (!simActive) {
    const r = await API('/api/simulation/start', {method:'POST'});
    simActive = true;
    btn.textContent = 'Stop Simulation';
    document.getElementById('sim-badge-sidebar').style.display = 'flex';
    document.querySelector('#sim-toggle-btn').classList.replace('btn-warning','btn-danger');
    toast('🏭 Factory simulation started — Machine B-202 will develop anomalies.', 'warning');
  } else {
    const r = await API('/api/simulation/stop', {method:'POST'});
    simActive = false;
    btn.textContent = 'Start Simulation';
    document.getElementById('sim-badge-sidebar').style.display = 'none';
    document.querySelector('#sim-toggle-btn').classList.replace('btn-danger','btn-warning');
    toast('Simulation stopped.', 'success');
  }
}

// ── Poll simulation status ────────────────────────────────────────────────────
async function checkSimStatus() {
  const r = await API('/api/simulation/status');
  simActive = r.active;
  const btn = document.getElementById('sim-btn-text');
  const simBadge = document.getElementById('sim-badge-sidebar');
  if (simActive) {
    btn.textContent = 'Stop Simulation';
    simBadge.style.display = 'flex';
    document.querySelector('#sim-toggle-btn').className = 'btn btn-danger btn-sm';
  } else {
    btn.textContent = 'Start Simulation';
    simBadge.style.display = 'none';
    document.querySelector('#sim-toggle-btn').className = 'btn btn-warning btn-sm';
  }
}

// ── Alert count in nav ────────────────────────────────────────────────────────
async function updateAlertCount() {
  try {
    const alerts = await API('/api/alerts?status=active&limit=500');
    const count = alerts.length;
    const badge = document.getElementById('nav-alert-count');
    if (count > 0) { badge.textContent = count; badge.style.display = 'inline'; }
    else badge.style.display = 'none';
  } catch(e) {}
}

// ── Groq status ───────────────────────────────────────────────────────────────
async function checkGroqStatus() {
  try {
    const r = await API('/api/dashboard');
    const badge = document.getElementById('groq-badge');
    if (r.groq_available) badge.style.display = 'inline-flex';
    else badge.style.display = 'none';
  } catch(e) {}
}

function refreshPage() {
  if (typeof loadPageData === 'function') loadPageData();
}

// Init
checkSimStatus();
updateAlertCount();
checkGroqStatus();
setInterval(updateAlertCount, 15000);
setInterval(checkSimStatus, 5000);
</script>

</body>
</html>
