<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FactoryIQ — Defect Prediction</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout">
  {% include 'partials/sidebar.html' %}
  <div class="main-content">
    {% include 'partials/topbar.html' %}
    <div class="page-body">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h2 style="font-size:1.1rem;font-weight:600">Predictive Quality — Defect Prediction</h2>
        <button class="btn btn-primary btn-sm" onclick="runPrediction()"><i class="fas fa-brain"></i> Run AI Analysis</button>
      </div>

      <!-- Overview prediction cards -->
      <div id="pred-kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem">
        <div class="loading-overlay"><div class="spinner"></div></div>
      </div>

      <!-- Charts row -->
      <div class="row section-gap">
        <div class="col-half">
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-chart-line text-red"></i> Defect Risk Trend</div></div>
            <div class="card-body"><div style="height:200px"><canvas id="chart-risk-trend"></canvas></div></div>
          </div>
        </div>
        <div class="col-half">
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-chart-pie text-amber"></i> Defect Type Distribution</div></div>
            <div class="card-body"><div style="height:200px"><canvas id="chart-defect-types"></canvas></div></div>
          </div>
        </div>
      </div>

      <!-- Prediction table -->
      <div class="card section-gap">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-table text-blue"></i> Latest Predictions by Machine</div>
        </div>
        <div class="card-body" style="padding:0">
          <div class="table-container">
            <table>
              <thead><tr>
                <th>Machine</th><th>Defect Probability</th><th>Risk</th><th>Predicted Defect</th>
                <th>Confidence</th><th>Top Factor</th><th>Time</th><th>Action</th>
              </tr></thead>
              <tbody id="pred-table-body">
                <tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:2rem">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- AI Analysis panel -->
      <div class="card section-gap" id="ai-pred-panel" style="display:none">
        <div class="card-header"><div class="card-title"><i class="fas fa-brain text-purple"></i> AI Defect Analysis</div></div>
        <div class="card-body" id="ai-pred-body"></div>
      </div>

    </div>
  </div>
</div>
<div id="toast-container"></div>
<script>
Chart.defaults.color='#64748b'; Chart.defaults.borderColor='rgba(255,255,255,0.06)';
function fmtVal(v,d=1){return v!=null?(+v).toFixed(d):'—';}
function riskColor(r){return {CRITICAL:'red',HIGH:'red',MEDIUM:'amber',LOW:'green'}[r]||'green';}

let riskTrendChart=null, defectTypeChart=null;

function initCharts(){
  const rtCtx=document.getElementById('chart-risk-trend')?.getContext('2d');
  if(rtCtx){riskTrendChart=new Chart(rtCtx,{type:'line',data:{labels:[],datasets:[{label:'Avg Defect Risk %',data:[],borderColor:'rgb(239,68,68)',backgroundColor:'rgba(239,68,68,0.08)',borderWidth:2,tension:.4,fill:true,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{min:0,max:100,grid:{color:'rgba(255,255,255,.04)'},ticks:{font:{size:10},callback:v=>v+'%'}}}}})}
  const dtCtx=document.getElementById('chart-defect-types')?.getContext('2d');
  if(dtCtx){defectTypeChart=new Chart(dtCtx,{type:'doughnut',data:{labels:[],datasets:[{data:[],backgroundColor:['#ef4444','#f59e0b','#3b82f6','#8b5cf6','#22c55e','#06b6d4'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},color:'#94a3b8'}}}}})}
}

async function loadPageData(){
  const [preds, analytics] = await Promise.all([API('/api/predictions?limit=50'), API('/api/analytics?days=7')]);

  // KPIs
  const kpiEl=document.getElementById('pred-kpi-grid');
  if(preds.length){
    const avg=(preds.reduce((a,p)=>a+(p.defect_probability||0),0)/preds.length*100).toFixed(1);
    const high=preds.filter(p=>(p.defect_probability||0)>0.5).length;
    const critical=preds.filter(p=>(p.defect_probability||0)>0.7).length;
    kpiEl.innerHTML=`
      <div class="kpi-card amber"><div class="kpi-label">Avg Defect Risk</div><div class="kpi-value text-amber">${avg}%</div></div>
      <div class="kpi-card red"><div class="kpi-label">High Risk Count</div><div class="kpi-value text-red">${high}</div></div>
      <div class="kpi-card red"><div class="kpi-label">Critical Risk</div><div class="kpi-value text-red">${critical}</div></div>
      <div class="kpi-card blue"><div class="kpi-label">Total Predictions</div><div class="kpi-value">${preds.length}</div></div>`;
  }

  // Table — latest per machine
  const byMachine={};
  preds.forEach(p=>{if(!byMachine[p.machine_id]||new Date(p.timestamp)>new Date(byMachine[p.machine_id].timestamp))byMachine[p.machine_id]=p;});
  const latest=Object.values(byMachine);
  const tbody=document.getElementById('pred-table-body');
  const pc={HIGH:'red',MEDIUM:'amber',LOW:'green',CRITICAL:'red'};
  tbody.innerHTML=latest.sort((a,b)=>(b.defect_probability||0)-(a.defect_probability||0)).map(p=>{
    const dpPct=((p.defect_probability||0)*100).toFixed(1);
    const rc=riskColor(p.risk_category);
    const factors=p.contributing_factors||[];
    const topFactor=factors[0]?.parameter||'—';
    const ts=new Date(p.timestamp+'Z');
    return `<tr>
      <td><strong style="color:var(--text-primary)">${p.machine_id}</strong></td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="progress-bar-track" style="width:80px;flex-shrink:0"><div class="progress-bar-fill fill-${p.defect_probability>0.6?'red':'amber'}" style="width:${dpPct}%"></div></div>
          <span style="font-weight:600;color:var(--text-primary)">${dpPct}%</span>
        </div>
      </td>
      <td><span class="badge badge-${pc[p.risk_category]||'green'}">${p.risk_category||'LOW'}</span></td>
      <td style="color:var(--text-secondary);font-size:.82rem">${p.predicted_defect||'—'}</td>
      <td>${((p.confidence_score||0)*100).toFixed(0)}%</td>
      <td style="font-size:.8rem;color:var(--text-muted)">${topFactor}</td>
      <td style="font-size:.75rem;color:var(--text-muted)">${ts.toLocaleTimeString()}</td>
      <td><a href="/machines/${p.machine_id}" class="btn btn-ghost btn-sm">Analyze</a></td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:2rem">No predictions yet. Generate demo data first.</td></tr>';

  // Risk trend from analytics
  if(analytics.daily_quality&&riskTrendChart){
    riskTrendChart.data.labels=analytics.daily_quality.map(d=>d.day?.slice(5)||'');
    riskTrendChart.data.datasets[0].data=analytics.daily_quality.map(d=>Math.max(0,100-d.avg_quality));
    riskTrendChart.update();
  }

  // Defect types
  if(analytics.defect_types&&defectTypeChart){
    defectTypeChart.data.labels=analytics.defect_types.map(d=>d.defect_type);
    defectTypeChart.data.datasets[0].data=analytics.defect_types.map(d=>d.count);
    defectTypeChart.update();
  }
}

async function runPrediction(){
  document.getElementById('ai-pred-panel').style.display='block';
  document.getElementById('ai-pred-body').innerHTML='<div class="loading-overlay"><div class="spinner"></div> Running AI analysis pipeline...</div>';
  const result=await API('/api/ai/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({machine_id:'B-202'})});
  const pred=result.prediction||{};
  const dp=((pred.defect_probability||0)*100).toFixed(1);
  const rc={CRITICAL:'red',HIGH:'red',MEDIUM:'amber',LOW:'green'}[pred.risk_category]||'green';
  const factors=pred.contributing_factors||[];
  document.getElementById('ai-pred-body').innerHTML=`
    <div style="display:flex;gap:2rem;flex-wrap:wrap;margin-bottom:1rem">
      <div style="text-align:center">
        <div style="font-size:3rem;font-weight:800;color:var(--accent-${pred.defect_probability>0.5?'red':'amber'})">${dp}%</div>
        <div style="font-size:.8rem;color:var(--text-muted)">Defect Probability</div>
        <span class="badge badge-${rc}">${pred.risk_category||'LOW'}</span>
      </div>
      <div style="flex:1;min-width:200px">
        <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.5rem">CONTRIBUTING FACTORS</div>
        ${factors.slice(0,5).map(f=>`
          <div class="factor-bar">
            <div class="factor-header"><span class="factor-name">${f.parameter}</span><span class="factor-pct">${f.deviation_pct||0}% deviation</span></div>
            <div class="progress-bar-track"><div class="progress-bar-fill fill-${f.deviation_pct>25?'red':'amber'}" style="width:${Math.min(f.contribution||f.deviation_pct||0,100)}%"></div></div>
          </div>`).join('')}
      </div>
    </div>
    <div style="padding:.8rem;background:rgba(255,255,255,.02);border-radius:8px;font-size:.875rem;color:var(--text-secondary);line-height:1.7">
      ${result.ai_explanation||pred.explanation||'Analysis complete.'}
    </div>
    <div style="margin-top:.8rem;padding:.6rem;background:rgba(245,158,11,.08);border-radius:6px;font-size:.73rem;color:var(--accent-amber)">
      <i class="fas fa-exclamation-triangle"></i> AI recommendation — verify with qualified engineering personnel before applying operational changes.
    </div>`;
}

initCharts();
loadPageData();
setInterval(loadPageData, 10000);
</script>
</body>
</html>
